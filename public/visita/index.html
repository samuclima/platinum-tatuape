<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Visita ao lazer · Platinum Tatuapé</title>
<meta name="description" content="Caminhe pelo Platinum Tatuapé: do hall de entrada ao lazer do térreo, do 1º e do 2º pavimento." />
<meta name="theme-color" content="#1a1220" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700&display=swap" rel="stylesheet" />
<style>
  :root { --warm: #eba680; --rose: #c97c6a; --ink: #fff; --glass: rgba(24, 16, 22, .5); --line: rgba(255, 255, 255, .22); --ease: cubic-bezier(.22, .9, .24, 1); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1220; color: var(--ink); font-family: Manrope, system-ui, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; }
  /* the street-view cube (visita.js): same rules as the home page's plan-card visits */
  .host { position: fixed; inset: 0; }
  .pv { overflow: hidden; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; background: #1a1220; }
  .pv.drag { cursor: grabbing; }
  .pv-cam { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-style: preserve-3d; }
  .pv-cube { position: absolute; transform-style: preserve-3d; }
  .pv-face { position: absolute; display: block; backface-visibility: hidden; pointer-events: none; user-select: none; }
  .pv-arrow { position: absolute; left: -34px; top: -34px; width: 68px; height: 68px; padding: 0; border-radius: 50%; cursor: pointer; display: grid; place-items: center;
    color: #fff; background: rgba(20, 14, 30, .32); border: 2px solid rgba(255, 255, 255, .9); box-shadow: 0 0 0 1px rgba(0, 0, 0, .15); transition: background .2s, color .2s; }
  .pv-arrow svg { width: 34px; height: 34px; }
  .pv-arrow:hover, .pv-arrow:focus-visible { background: #fff; color: #1a1220; outline: none; }
  .pv-arrow.back { opacity: .72; transform-origin: center; }
  .pv-arrow span { position: absolute; top: 100%; left: 50%; translate: -50% 0; margin-top: 8px; padding: 3px 9px; border-radius: 999px; background: rgba(20, 14, 30, .55);
    font-size: 13px; font-weight: 600; white-space: nowrap; pointer-events: none; }
  .walking .pv-arrow { display: none; }

  /* top bar */
  .bar { position: fixed; z-index: 5; top: max(12px, env(safe-area-inset-top)); left: 12px; right: 12px; display: flex; align-items: center; gap: 8px; pointer-events: none; }
  .chip, .btn { pointer-events: auto; background: var(--glass); -webkit-backdrop-filter: blur(14px) saturate(1.3); backdrop-filter: blur(14px) saturate(1.3); border: 1px solid var(--line); color: #fff; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; text-decoration: none; letter-spacing: .02em; }
  .chip:hover { background: rgba(255, 255, 255, .2); }
  .ttl { font-weight: 400; opacity: .9; }
  .btn { width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 17px; line-height: 1; display: grid; place-items: center; }
  .btn:hover, .btn:focus-visible { background: rgba(255, 255, 255, .28); outline: none; }
  .bar .sp { margin-left: auto; }
  .talk { pointer-events: auto; display: inline-flex; align-items: center; height: 40px; padding: 0 16px; border-radius: 999px; background: #25d366; color: #fff; text-decoration: none; font-size: 13px; font-weight: 700; box-shadow: 0 8px 20px -10px rgba(0, 0, 0, .5); transition: background .2s; }
  .talk:hover, .talk:focus-visible { background: #1ebe5b; outline: none; }

  /* the stop popup: area, text, the floor's plan (route + where you are), previous / next */
  .card { position: fixed; z-index: 4; left: clamp(12px, 2vw, 28px); bottom: clamp(12px, 3vh, 28px); width: min(400px, calc(100vw - 24px));
    padding: 20px 20px 16px; border-radius: 22px; background: rgba(24, 16, 22, .58); -webkit-backdrop-filter: blur(22px) saturate(1.4); backdrop-filter: blur(22px) saturate(1.4);
    border: 1px solid var(--line); box-shadow: 0 30px 70px -30px rgba(0, 0, 0, .6); transition: opacity .45s ease, translate .6s var(--ease); }
  .walking .card, .lifting .card { opacity: 0; translate: 0 18px; pointer-events: none; }
  .card.min .more { display: none; }
  .k { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--warm); }
  .k .x { margin-left: auto; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: none; color: #fff; cursor: pointer; font-size: 14px; letter-spacing: 0; }
  .k .x:hover { background: rgba(255, 255, 255, .15); }
  .card h1 { margin: 8px 0 6px; font-weight: 300; font-size: clamp(26px, 2.4vw, 34px); line-height: 1.08; letter-spacing: -.02em; }
  .card p.t { margin: 0; font-size: 14.5px; line-height: 1.6; color: rgba(255, 255, 255, .86); }
  .plan { margin: 14px 0 0; padding: 10px; border-radius: 14px; background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .1); }
  .plan svg { display: block; width: 100%; height: clamp(130px, 24vh, 210px); overflow: hidden; }
  .plan .walls rect { fill: rgba(255, 255, 255, .78); }
  .plan .glass rect { fill: rgba(150, 200, 255, .55); }
  .plan .route { fill: none; stroke: var(--warm); stroke-width: .35; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: .2 .9; opacity: .9; }
  .plan .stop { cursor: pointer; }
  .plan .stop .hit { fill: transparent; }
  .plan .stop .dot { fill: rgba(255, 255, 255, .9); stroke: rgba(24, 16, 22, .7); stroke-width: .12; transition: fill .2s; }
  .plan .stop:hover .dot { fill: var(--warm); }
  .plan .stop.on .dot { fill: var(--warm); }
  .plan .cone { fill: rgba(235, 166, 128, .32); stroke: none; }
  .plan .me { fill: var(--warm); stroke: #fff; stroke-width: .18; }
  .plan .lvl { display: flex; gap: 6px; margin-top: 8px; }
  .lvl span { padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: .06em; color: rgba(255, 255, 255, .6); border: 1px solid rgba(255, 255, 255, .14); }
  .lvl span.on { color: #1a1220; background: #fff; border-color: #fff; }
  .nav { display: flex; gap: 8px; margin-top: 14px; }
  .nav button { padding: 11px 14px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255, 255, 255, .08); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; transition: background .2s, color .2s; }
  .nav button:hover, .nav button:focus-visible { background: rgba(255, 255, 255, .2); outline: none; }
  .nav .nx { flex: 1; background: #fff; color: #1a1220; border-color: #fff; text-align: left; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .nav .nx:hover, .nav .nx:focus-visible { background: var(--warm); border-color: var(--warm); }
  .nav .nx b { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav button:disabled { opacity: .35; cursor: default; }
  .hint { position: fixed; z-index: 3; left: 50%; translate: -50% 0; top: max(64px, calc(env(safe-area-inset-top) + 52px)); margin: 0; padding: 7px 14px; border-radius: 999px; font-size: 12.5px;
    background: var(--glass); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid var(--line); transition: opacity .8s; pointer-events: none; }
  .used .hint { opacity: 0; }

  /* legal tags (brochure wording) */
  .ill { position: fixed; z-index: 3; right: 14px; bottom: max(14px, env(safe-area-inset-bottom)); margin: 0; padding: 4px 9px; border-radius: 999px; font-size: 10px; font-weight: 600;
    letter-spacing: .14em; text-transform: uppercase; background: var(--glass); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); pointer-events: none; }
  .plan { position: relative; } .pill { position: absolute; right: 10px; top: 8px; margin: 0; font-size: 9.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: rgba(255, 255, 255, .55); }
  @media (max-width: 700px) { .ill { right: auto; left: 50%; translate: -50% 0; top: 122px; bottom: auto; } }   /* phones: under the hint */
  /* the lift between floors: the view dims, the floor's name rises in, then the next floor opens */
  .lift { position: fixed; inset: 0; z-index: 6; display: grid; place-items: center; background: #1a1220; opacity: 0; pointer-events: none; transition: opacity .55s ease; }
  .lifting .lift { opacity: 1; pointer-events: auto; }
  .lift p { margin: 0; text-align: center; }
  .lift .lk { font-size: 12px; font-weight: 600; letter-spacing: .24em; text-transform: uppercase; color: var(--warm); }
  .lift .ln { margin-top: 10px; font-weight: 300; font-size: clamp(34px, 5vw, 64px); letter-spacing: -.02em; }
  .lift .ar { margin: 18px auto 0; width: 2px; height: 46px; background: linear-gradient(transparent, #fff); animation: up 1.1s ease-in-out infinite; }
  @keyframes up { from { transform: translateY(14px); opacity: 0; } 50% { opacity: 1; } to { transform: translateY(-14px); opacity: 0; } }

  /* loading */
  .load { position: fixed; inset: 0; z-index: 7; display: grid; place-items: center; background: #1a1220 url("../platinum/img/lobby.jpg") center / cover; transition: opacity .8s ease; }
  .load::before { content: ""; position: absolute; inset: 0; background: rgba(20, 12, 18, .55); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .load div { position: relative; display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 600; letter-spacing: .04em; }
  .load i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .3); border-top-color: #fff; animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(1turn); } }
  .ready .load { opacity: 0; pointer-events: none; }

  @media (max-width: 700px) {
    .ttl { display: none; }
    .card { left: 8px; right: 8px; width: auto; bottom: max(8px, env(safe-area-inset-bottom)); padding: 16px 16px 12px; border-radius: 18px; }
    .card h1 { font-size: 24px; }
    .card p.t { font-size: 13.5px; }
    .plan svg { height: 120px; }
  }
  @media (prefers-reduced-motion: reduce) { .card, .lift, .load { transition: none; } .lift .ar { animation: none; } }
</style>
</head>
<body>
<div class="host" id="host" role="application" aria-label="Visita 360° ao lazer do Platinum"></div>
<header class="bar">
  <a class="chip" href="../">← Voltar <span class="ttl">· Platinum Tatuapé</span></a>
  <a class="talk sp" href="../index.html#contato">Fale conosco</a>
  <button class="btn" type="button" id="fs" aria-label="Tela cheia">⤢</button>
</header>
<section class="card" id="card" aria-live="polite">
  <p class="k"><span id="cK">Térreo · 1 de 9</span><button class="x" type="button" id="cMin" aria-label="Recolher">–</button></p>
  <h1 id="cName">Hall de entrada</h1>
  <div class="more">
    <p class="t" id="cText"></p>
    <div class="plan"><svg id="cPlan" aria-label="Planta do pavimento"></svg><div class="lvl" id="cLvl"></div><p class="pill">Planta ilustrativa</p></div>
  </div>
  <div class="nav"><button type="button" id="cPrev" aria-label="Anterior">←</button><button type="button" class="nx" id="cNext"><span>Próximo</span><b>→</b></button></div>
</section>
<p class="hint">Arraste para olhar · clique nas setas para caminhar</p>
<p class="ill">Perspectiva ilustrativa</p>
<div class="lift" aria-hidden="true"><div><p class="lk">Subindo ao</p><p class="ln" id="lName">1º pavimento</p><div class="ar"></div></div></div>
<div class="load"><div><i></i>Preparando a visita</div></div>
<script type="module">
  import { visita } from './visita.js';
  const $ = id => document.getElementById(id), NS = 'http://www.w3.org/2000/svg', doc = document.documentElement;
  let v = null, data = null, plans = {}, yawNow = 0, hfNow = 90;
  const ui = {
    at(i) { drawMe(i); },
    look(y, hf) { yawNow = y; hfNow = hf; if (v) drawMe(v.point); },
    walking(on) { doc.classList.toggle('walking', on); },
    stop(si) { if (v) fill(si); },                                     // (the first stop is filled once the viewer is ready)
    lift(name, swap) { return new Promise(res => {                   // dim, name of the floor, swap the view, open
      $('lName').textContent = name; doc.classList.add('lifting');
      setTimeout(async () => { await swap(); setTimeout(() => { doc.classList.remove('lifting'); res(); }, 900); }, 700); }); },
  };
  // the floor's plan: walls, glass, the route through it, one dot per stop (click → walk there), you-are-here + view cone
  function planFor(lv) {
    if (plans[lv]) return plans[lv];
    const { box: [x0, z0, x1, z1], walls, glass } = data.levels[lv].plan, r = a => `<rect x="${(a[0] - x0).toFixed(2)}" y="${(a[1] - z0).toFixed(2)}" width="${(a[2] - a[0]).toFixed(2)}" height="${(a[3] - a[1]).toFixed(2)}"/>`;
    const route = data.points.map((p, i) => [p, i]).filter(([p]) => p.lv === lv).map(([p]) => `${(p.x - x0).toFixed(2)},${(p.z - z0).toFixed(2)}`).join(' ');
    // frame: the part of the floor the route covers (+4 m), not the whole outline – bigger, easier to read
    const mine = data.points.filter(p => p.lv === lv), m = 4, bx0 = Math.max(x0, Math.min(...mine.map(p => p.x)) - m), bz0 = Math.max(z0, Math.min(...mine.map(p => p.z)) - m);
    const bx1 = Math.min(x1, Math.max(...mine.map(p => p.x)) + m), bz1 = Math.min(z1, Math.max(...mine.map(p => p.z)) + m);
    return plans[lv] = { x0, z0, html: `<g class="glass">${glass.map(r).join('')}</g><g class="walls">${walls.map(r).join('')}</g><polyline class="route" points="${route}"/>`,
      vb: `${(bx0 - x0).toFixed(2)} ${(bz0 - z0).toFixed(2)} ${(bx1 - bx0).toFixed(2)} ${(bz1 - bz0).toFixed(2)}` };
  }
  let shownLv = null;
  function fill(si) {
    const s = data.stops[si], lvStops = data.stops.filter(t => t.lv === s.lv), k = lvStops.indexOf(s);
    $('cK').textContent = `${data.levels[s.lv].name} · ${k + 1} de ${lvStops.length}`;
    $('cName').textContent = s.name; $('cText').textContent = v.text(s.id);
    if (shownLv !== s.lv) {
      shownLv = s.lv; const P = planFor(s.lv), svg = $('cPlan'); svg.setAttribute('viewBox', P.vb);
      svg.innerHTML = P.html + '<path class="cone"/><g class="stops"></g><circle class="me" r=".45"/>';
      const g = svg.querySelector('.stops');
      data.stops.forEach((t, ti) => { if (t.lv !== s.lv) return; const p = data.points[t.pt], e = document.createElementNS(NS, 'g');
        e.setAttribute('class', 'stop'); e.dataset.i = ti; e.setAttribute('transform', `translate(${(p.x - P.x0).toFixed(2)} ${(p.z - P.z0).toFixed(2)})`);
        e.innerHTML = `<title>${t.name}</title><circle class="hit" r="1.2"/><circle class="dot" r=".38"/>`; e.addEventListener('click', () => v.goStop(ti)); g.appendChild(e); });
      $('cLvl').innerHTML = Object.entries(data.levels).map(([id, L]) => `<span class="${id === s.lv ? 'on' : ''}">${L.name}</span>`).join('');
    }
    $('cPlan').querySelectorAll('.stop').forEach(e => e.classList.toggle('on', +e.dataset.i === si));
    const prev = data.stops[si - 1], next = data.stops[si + 1];
    $('cPrev').disabled = !prev; $('cPrev').setAttribute('aria-label', prev ? `Voltar para ${prev.name}` : 'Início da visita');
    const nx = $('cNext'); nx.disabled = !next;
    nx.innerHTML = !next ? '<span>Fim da visita</span><b>✓</b>' : next.lv !== s.lv ? `<span>Subir ao ${data.levels[next.lv].name}</span><b>↑</b>` : `<span>${next.name}</span><b>→</b>`;
    drawMe(v.point);
  }
  function drawMe(i) {
    const p = data?.points[i], P = p && plans[p.lv]; if (!P || p.lv !== shownLv) return;
    const svg = $('cPlan'), cx = p.x - P.x0, cz = p.z - P.z0, R = 3.2, half = Math.min(hfNow, 150) * Math.PI / 360, pt = a => `${(cx - Math.sin(a) * R).toFixed(2)} ${(cz - Math.cos(a) * R).toFixed(2)}`;
    svg.querySelector('.me')?.setAttribute('cx', cx.toFixed(2)); svg.querySelector('.me')?.setAttribute('cy', cz.toFixed(2));
    svg.querySelector('.cone')?.setAttribute('d', `M${cx.toFixed(2)} ${cz.toFixed(2)} L${pt(yawNow - half)} A${R} ${R} 0 0 0 ${pt(yawNow + half)} Z`);
  }
  $('cPrev').addEventListener('click', () => v?.goStop(v.stop - 1));
  $('cNext').addEventListener('click', () => v?.goStop(v.stop + 1));
  $('cMin').addEventListener('click', () => { const m = $('card').classList.toggle('min'); $('cMin').textContent = m ? '+' : '–'; $('cMin').setAttribute('aria-label', m ? 'Abrir' : 'Recolher'); });
  $('fs').addEventListener('click', () => document.fullscreenElement ? document.exitFullscreen() : doc.requestFullscreen?.());
  addEventListener('keydown', e => { if (!v || e.target.closest?.('input,textarea')) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') v.goStop(v.stop + 1); if (e.key === 'ArrowLeft' || e.key === 'PageUp') v.goStop(v.stop - 1); });
  if (matchMedia('(max-width: 700px)').matches) { $('card').classList.add('min'); $('cMin').textContent = '+'; }   // phones: the view first, the text a tap away
  visita($('host'), { base: 'pano/', ui, start: decodeURIComponent(location.hash.slice(1)) || null, onReady: () => { doc.classList.add('ready'); setTimeout(() => doc.classList.add('used'), 7000); } })
    .then(x => { v = x; data = x.data; fill(x.stop); })
    .catch(err => { console.error('visita:', err); document.querySelector('.load div').textContent = 'Não foi possível abrir a visita'; });
</script>
</body>
</html>
